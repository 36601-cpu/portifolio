    // --- CONTACT COMPONENT ---
    function Contact({ personal }) {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        subject: '',
        message: ''
      });

      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [copiedItem, setCopiedItem] = useState(null);

      const validate = () => {
        const errs = {};
        if (!formData.name.trim()) errs.name = 'Por favor, informe seu nome.';
        if (!formData.email.trim()) {
          errs.email = 'Por favor, informe seu e-mail.';
        } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
          errs.email = 'Por favor, informe um e-mail válido.';
        }
        if (!formData.subject.trim()) errs.subject = 'Por favor, informe o assunto.';
        if (!formData.message.trim()) errs.message = 'Por favor, escreva sua mensagem.';
        return errs;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
        if (errors[name]) {
          setErrors(prev => ({ ...prev, [name]: null }));
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate();
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }

        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          setIsSubmitted(true);
          setFormData({ name: '', email: '', subject: '', message: '' });
          setTimeout(() => setIsSubmitted(false), 6000);
        }, 1200);
      };

      const handleSendViaWhatsApp = () => {
        const validationErrors = validate();
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }

        const text = encodeURIComponent(
          `Olá Gustavo! Meu nome é ${formData.name} (${formData.email}).\n\nAssunto: ${formData.subject}\n\nMensagem: ${formData.message}`
        );
        window.open(`https://wa.me/${personal.phoneRaw}?text=${text}`, '_blank');
      };

      const copyToClipboard = (text, type) => {
        navigator.clipboard.writeText(text);
        setCopiedItem(type);
        setTimeout(() => setCopiedItem(null), 2500);
      };

                            <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            <span>Processando...</span>
                          </>
                        ) : (
                          <>
                            <span>Enviar Mensagem</span>
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                          </>
                        )}
                      </button>

                      <button
                        type="button"
                        onClick={handleSendViaWhatsApp}
                        className="py-3.5 px-5 rounded-xl font-semibold text-sm border border-emerald-500/30 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 transition-all flex items-center justify-center gap-2"
                        title="Preencher e enviar diretamente pelo WhatsApp"
                      >
                        <span>Enviar via WhatsApp</span>
                        <span className="text-base">📲</span>
                      </button>
                    </div>

                  </form>

                </div>
              </div>

            </div>

          </div>
        </section>
      );
    }

    // --- REFERENCES MODAL COMPONENT ---
    function ReferencesModal({ isOpen, onClose, references }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-fadeIn">
          <div className="relative w-full max-w-4xl glass-panel p-6 sm:p-10 rounded-3xl border border-purple-500/40 shadow-2xl overflow-y-auto max-h-[90vh]">
            
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2.5 rounded-xl bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/30 text-purple-300 transition-colors"
              aria-label="Fechar modal"
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>

            <div className="mb-8 pb-4 border-b border-purple-500/20">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono-code bg-purple-500/15 border border-purple-500/30 text-purple-300 mb-2">
                <span>AWWWARDS & SITEINSPIRE</span>
              </div>
              <h3 className="text-2xl sm:text-3xl font-extrabold text-white">
                Documento de Referências Visuais de Design
              </h3>
              <p className="text-xs sm:text-sm text-slate-400 mt-2 max-w-2xl leading-relaxed">
                Pesquisa aprofundada de 5 referências internacionais premiadas utilizadas para guiar a identidade visual, tipografia, paleta e arquitetura deste portfólio.
              </p>
            </div>

            <div className="space-y-6">
              {references.map((ref, idx) => (
                <div
                  key={idx}
                  className="p-6 rounded-2xl bg-purple-950/20 border border-purple-500/20 hover:border-purple-500/40 transition-all duration-200"
                >
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                    <div className="flex items-center gap-3">
                      <span className="w-7 h-7 rounded-xl bg-purple-500/20 text-purple-400 font-mono-code text-xs font-bold flex items-center justify-center">
                        0{idx + 1}
                      </span>
                      <h4 className="text-lg font-bold text-white">
                        {ref.name}
                      </h4>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono-code px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                        {ref.award}
                      </span>
                      <a
                        href={ref.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-xs font-mono-code text-purple-400 hover:text-purple-300 underline flex items-center gap-1"
                      >
                        <span>Acessar</span>
                        <span>↗</span>
                      </a>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs mt-4 pt-4 border-t border-purple-500/10">
                    <div>
                      <strong className="text-purple-300 font-mono-code block mb-1">Cores Utilizadas:</strong>
                      <span className="text-slate-300">{ref.colors}</span>
                    </div>
                    <div>
                      <strong className="text-purple-300 font-mono-code block mb-1">Tipografia:</strong>
                      <span className="text-slate-300">{ref.typography}</span>
                    </div>
                    <div>
                      <strong className="text-purple-300 font-mono-code block mb-1">Organização do Layout:</strong>
                      <span className="text-slate-300">{ref.layout}</span>
                    </div>
                    <div>
                      <strong className="text-purple-300 font-mono-code block mb-1">Animações & Navegação:</strong>
                      <span className="text-slate-300">{ref.motion}</span>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-purple-500/10 bg-purple-950/30 p-3 rounded-xl">
                    <strong className="text-emerald-400 font-mono-code text-[11px] block mb-1">
                      💡 O que chamou a atenção:
                    </strong>
                    <p className="text-xs text-slate-300 leading-relaxed italic">
                      "{ref.highlight}"
                    </p>
                  </div>

                </div>
              ))}
            </div>

            <div className="mt-8 pt-6 border-t border-purple-500/20 flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="text-xs text-slate-400 font-mono-code">
                Arquivo de documentação disponível em: REFERENCIAS_VISUAIS.md
              </span>
              <button
                onClick={onClose}
                className="w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-semibold bg-purple-600 text-white hover:bg-purple-500 transition-colors"
              >
                Fechar Janela
              </button>
            </div>

          </div>
        </div>
      );
    }

    // --- FOOTER COMPONENT ---
    function Footer({ personal, onOpenReferences }) {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="relative py-12 border-t border-purple-500/15 bg-slate-950/60 backdrop-blur-md">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="flex flex-col md:flex-row items-center justify-between gap-6 pb-8 border-b border-purple-500/10">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-purple-500/25">
                  GH
                </div>
                <div>
                  <h4 className="font-bold text-white text-base leading-tight">
                    {personal.name}
                  </h4>
                  <p className="text-xs text-slate-400 font-mono-code">
                    {personal.role}
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-6 text-xs text-slate-400">
                <a href="#inicio" className="hover:text-purple-400 transition-colors">Início</a>
                <a href="#sobre" className="hover:text-purple-400 transition-colors">Sobre</a>
                <a href="#habilidades" className="hover:text-purple-400 transition-colors">Habilidades</a>
                <a href="#projetos" className="hover:text-purple-400 transition-colors">Projetos</a>
                <a href="#contato" className="hover:text-purple-400 transition-colors">Contato</a>
                <button
                  onClick={onOpenReferences}
                  className="text-purple-400 hover:text-purple-300 font-mono-code underline underline-offset-4"
                >
                  Referências de Design
                </button>
              </div>

              <button
                onClick={scrollToTop}
                className="p-3 rounded-2xl bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/20 text-purple-300 hover:text-white transition-all flex items-center gap-2 text-xs font-mono-code"
                title="Voltar ao Topo"
              >
                <span>Topo</span>
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" />
                </svg>
              </button>
            </div>

            <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
              <p>© {new Date().getFullYear()} Gustavo Henrique Barros Matiello. Todos os direitos reservados.</p>
              <div className="flex items-center gap-2 font-mono-code">
                <span className="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                <span>Desenvolvido com React, HTML5, CSS3 & JavaScript</span>
              </div>
            </div>

          </div>
        </footer>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('theme') || 'dark';
      });

      const [isReferencesOpen, setIsReferencesOpen] = useState(false);

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      return (
        <div className="min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">
          <Navbar
            theme={theme}
            toggleTheme={toggleTheme}
            onOpenReferences={() => setIsReferencesOpen(true)}
          />

          <main className="flex-1">
            <Hero personal={portfolioData.personal} />
            <About
              personal={portfolioData.personal}
              academic={portfolioData.academic}
              courses={portfolioData.courses}
            />
            <Skills categories={portfolioData.skillCategories} />
            <Projects projects={portfolioData.projects} />
            <Contact personal={portfolioData.personal} />
          </main>

          <Footer
            personal={portfolioData.personal}
            onOpenReferences={() => setIsReferencesOpen(true)}
          />

          <ReferencesModal
            isOpen={isReferencesOpen}
            onClose={() => setIsReferencesOpen(false)}
            references={portfolioData.designReferences}
          />
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>

</body>
</html>
